<meta charset="utf-8">
<title>Teacher Rambo's Social Media Survey</title>
<style>
  :root{
    --bg:#0a0e1a; --bg-2:#0d1220;
    --surface:#131829; --surface-2:#1a2036; --surface-hover:#1f2640;
    --border:#262d47; --border-soft:#1d2338;
    --text:#eef1fb; --text-dim:#98a0bd; --text-faint:#5b6386;
    --screen:#5b8cff; --screen-soft:rgba(91,140,255,.14); --screen-dim:#3f66c9;
    --human:#ff8a5c; --human-soft:rgba(255,138,92,.16); --human-dim:#d96f45;
    --good:#4ade80;
    --shadow: 0 24px 60px -24px rgba(0,0,0,.65);
    --radius: 20px;
    --accent: var(--screen);
    --accent-soft: var(--screen-soft);
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#eef1f7; --bg-2:#e6eaf3;
    --surface:#ffffff; --surface-2:#f7f9fd; --surface-hover:#eef1f9;
    --border:#d7dceb; --border-soft:#e3e7f2;
    --text:#161a26; --text-dim:#545b72; --text-faint:#8891a8;
    --screen:#3163e0; --screen-soft:rgba(49,99,224,.10); --screen-dim:#2450b8;
    --human:#d9642f; --human-soft:rgba(217,100,47,.12); --human-dim:#b6511f;
    --good:#1f9d55;
    --shadow: 0 24px 50px -28px rgba(30,40,70,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eef1f7; --bg-2:#e6eaf3;
      --surface:#ffffff; --surface-2:#f7f9fd; --surface-hover:#eef1f9;
      --border:#d7dceb; --border-soft:#e3e7f2;
      --text:#161a26; --text-dim:#545b72; --text-faint:#8891a8;
      --screen:#3163e0; --screen-soft:rgba(49,99,224,.10); --screen-dim:#2450b8;
      --human:#d9642f; --human-soft:rgba(217,100,47,.12); --human-dim:#b6511f;
      --good:#1f9d55;
      --shadow: 0 24px 50px -28px rgba(30,40,70,.25);
      color-scheme: light;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(600px 420px at 12% -8%, var(--screen-soft), transparent 60%),
      radial-gradient(560px 400px at 108% 22%, var(--human-soft), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Leelawadee UI", "Noto Sans Thai", Tahoma, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 16px 60px;
  }
  .mono{ font-family: "Cascadia Mono","Cascadia Code",Consolas,"SF Mono",monospace; font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  .topbar{
    width:100%; max-width:560px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg, var(--screen), var(--human));
    display:flex;align-items:center;justify-content:center;
    font-size:16px; flex:none;
  }
  .brand-text{ font-size:13px; color:var(--text-dim); line-height:1.25; min-width:0; }
  .brand-text b{ color:var(--text); font-weight:700; }
  .topbar-actions{ display:flex; align-items:center; gap:8px; flex:none; }
  .lang-toggle{
    display:flex; align-items:center; gap:2px;
    border:1px solid var(--border); background:var(--surface);
    border-radius:99px; padding:3px; flex:none;
  }
  .lang-btn{
    appearance:none; border:none; background:transparent; color:var(--text-faint);
    font-size:12px; font-weight:700; padding:6px 10px; border-radius:99px; cursor:pointer;
    letter-spacing:.02em;
  }
  .lang-btn.active{ background:var(--accent); color:#08101f; }
  .theme-toggle{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border); background:var(--surface);
    color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:15px; flex:none;
  }
  .theme-toggle:hover{ color:var(--text); border-color: var(--text-faint); }

  .progress-wrap{
    width:100%; max-width:560px; margin-bottom:22px;
  }
  .progress-track{
    height:6px; border-radius:99px; background:var(--surface-2);
    border:1px solid var(--border-soft); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:99px;
    background: linear-gradient(90deg, var(--screen), var(--human));
    width:0%; transition: width .45s cubic-bezier(.2,.8,.2,1);
  }
  .progress-label{
    display:flex; justify-content:space-between; margin-top:8px;
    font-size:11.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-faint); font-weight:600;
  }

  /* ---------- card ---------- */
  .stage{ width:100%; max-width:560px; position:relative; min-height:420px; }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 30px 26px 24px;
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    opacity:0; transform: translateY(14px) scale(.99);
    pointer-events:none;
    transition: opacity .38s ease, transform .38s cubic-bezier(.2,.8,.2,1);
  }
  .card.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; position:relative; }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; transform:none; }
    .winai-carousel img{ transition:none; }
  }

  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color: var(--accent); margin:0 0 10px;
  }
  h1.q{ font-size:22px; line-height:1.32; margin:0 0 6px; font-weight:750; letter-spacing:-.01em; text-wrap:balance; }
  p.help{ margin:0 0 20px; color:var(--text-dim); font-size:14.5px; line-height:1.55; }

  .options{ display:flex; flex-direction:column; gap:10px; flex:1; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

  .chip{
    appearance:none; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); border-radius:14px; padding:15px 16px;
    font-size:15px; font-weight:600; text-align:left; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition: border-color .15s, background .15s, transform .1s;
    min-height:52px;
  }
  .chip:hover{ background:var(--surface-hover); border-color:var(--text-faint); }
  .chip:active{ transform: scale(.985); }
  .chip .mark{
    width:20px;height:20px;border-radius:6px;border:1.5px solid var(--text-faint);
    flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent;
  }
  .chip.round .mark{ border-radius:50%; }
  .chip.selected{ border-color: var(--accent); background: var(--accent-soft); }
  .chip.selected .mark{ background:var(--accent); border-color:var(--accent); color:#0a0e1a; }
  .chip .sub{ font-size:12px; font-weight:500; color:var(--text-faint); }
  .chip.center{ justify-content:center; text-align:center; }

  .btn-row{ display:flex; gap:10px; margin-top:22px; }
  .btn{
    appearance:none; border:none; border-radius:13px; padding:14px 18px;
    font-size:15px; font-weight:700; cursor:pointer; flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: filter .15s, transform .1s, opacity .15s;
    text-decoration:none;
  }
  .btn:active{ transform: scale(.98); }
  .btn.primary{ background: var(--accent); color:#08101f; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.primary:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--border); flex:0 0 auto; padding:14px 16px; }
  .btn.ghost:hover{ color:var(--text); border-color:var(--text-faint); }
  .btn.human{ background:var(--human); color:#1c0d05; }
  .btn.human:hover{ filter:brightness(1.08); }

  /* intro */
  .intro-title{ font-size:26px; font-weight:800; letter-spacing:-.015em; line-height:1.28; margin:14px 0 10px; text-wrap:balance; }
  .intro-lede{ color:var(--text-dim); font-size:15px; line-height:1.6; margin:0 0 22px; }
  .intro-img{ width:100%; max-width:280px; display:block; margin:0 auto; border-radius:14px; }

  /* winai section */
  .winai-card{ background: linear-gradient(180deg, var(--human-soft), transparent 40%); }
  .winai-carousel{
    position:relative; width:100%; max-width:200px; aspect-ratio:9/16; margin:0 auto 16px;
    border-radius:16px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2);
    box-shadow: var(--shadow);
  }
  .winai-carousel img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform: translateX(100%); z-index:1;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
  }
  .winai-carousel img.active{ transform: translateX(0%); z-index:3; }
  .winai-carousel img.prev{ transform: translateX(-100%); z-index:2; }
  .winai-body{ font-size:14.5px; line-height:1.62; color:var(--text-dim); margin:0 0 6px; }
  .winai-body b{ color:var(--text); }
  .winai-steps{ display:flex; flex-direction:column; gap:8px; margin:14px 0 18px; }
  .winai-step{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--text-dim); }
  .winai-step .n{
    flex:none; width:20px;height:20px;border-radius:50%; background:var(--human-soft); color:var(--human);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px;
  }

  .scale-row{ display:flex; gap:8px; }
  .scale-btn{
    flex:1; aspect-ratio:1; border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text); font-size:17px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .scale-btn:hover{ border-color:var(--text-faint); }
  .scale-btn.selected{ border-color:var(--human); background:var(--human-soft); color:var(--human); }
  .scale-caps{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); margin-top:8px; }

  /* review */
  .review-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; flex:1; overflow:auto; }
  .review-item{
    display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
    padding:11px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-k{ color:var(--text-faint); flex:0 0 42%; }
  .review-v{ color:var(--text); font-weight:600; text-align:right; flex:1; }

  .send-hint{ font-size:12.5px; color:var(--text-faint); text-align:center; margin-top:10px; }

  .done-wrap{ text-align:center; padding:20px 6px; }
  .done-img{ width:100%; max-width:280px; margin:0 auto 18px; display:block; border-radius:14px; }
  .done-wrap h2{ font-size:20px; margin:0 0 8px; }
  .done-wrap p{ color:var(--text-dim); font-size:14px; line-height:1.55; margin:0; }

  ::selection{ background: var(--accent-soft); }
  a{ color:inherit; }

  /* ---------- report overlay ---------- */
  .report-overlay{
    position:fixed; inset:0; background:rgba(5,8,16,.72); backdrop-filter:blur(2px);
    display:none; align-items:flex-start; justify-content:center; padding:24px 16px; z-index:50; overflow:auto;
  }
  .report-overlay.show{ display:flex; }
  .report-panel{
    width:100%; max-width:640px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 20px 26px; margin:20px 0;
  }
  .report-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .report-topbar .report-title{ font-size:17px; font-weight:800; }
  .report-empty{ color:var(--text-dim); font-size:14px; text-align:center; padding:30px 10px; }
  .report-stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px; }
  .report-stat{ background:var(--surface-2); border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px; }
  .report-stat .v{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .report-stat .v.human{ color:var(--human); }
  .report-stat .k{ font-size:11.5px; color:var(--text-dim); margin-top:2px; }
  .report-section{ margin-bottom:20px; }
  .report-section h3{ font-size:12.5px; margin:0 0 10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; }
  .report-bar-row{ display:grid; grid-template-columns:112px 1fr 34px; align-items:center; gap:8px; margin-bottom:7px; }
  .report-bar-label{ font-size:11.5px; color:var(--text-dim); text-align:right; line-height:1.25; }
  .report-bar-track{ height:12px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border-soft); overflow:hidden; }
  .report-bar-fill{ height:100%; border-radius:6px; }
  .report-bar-value{ font-size:11px; color:var(--text-faint); font-weight:700; text-align:right; }
  .report-conclusions{ display:flex; flex-direction:column; gap:8px; }
  .report-conclusion{ font-size:13px; line-height:1.5; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px; }
</style>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">📱</div>
    <div class="brand-text" id="brandText"></div>
  </div>
  <div class="topbar-actions">
    <button class="theme-toggle" id="reportToggle" title="Build report" aria-label="Build report">📊</button>
    <div class="lang-toggle">
      <button class="lang-btn" id="langEN" type="button">EN</button>

    <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">◐</button>
  </div>
</div>

<div class="report-overlay" id="reportOverlay">
  <div class="report-panel">
    <div class="report-topbar">
      <div class="report-title" id="reportTitle">Class Report</div>
      <button class="theme-toggle" id="reportClose" aria-label="Close">✕</button>

    <div id="reportBody"></div>
  </div>
</div>

<div class="progress-wrap" id="progressWrap" style="display:none;">

  <div class="progress-label"><span id="progressText"></span><span id="progressPct">0%</span></div>
</div>

<div class="stage" id="stage"></div>

  function chip(html, selected, onClick, opts){
    opts = opts||{};
    var b = document.createElement('button');
    b.type='button';
    b.className = 'chip' + (opts.round?' round':'') + (opts.center?' center':'') + (selected?' selected':'');
    var mark = opts.center ? '' : '<span class="mark">'+(selected?'✓':'')+'</span>';
    b.innerHTML = '<span>'+html+'</span>' + mark;
    b.addEventListener('click', onClick);
    return b;
  }

  function renderSingle(container, codes, dict, current, onPick, opts){
    codes.forEach(function(code){
      container.appendChild(chip(dict[code], current===code, function(){ onPick(code); }, opts));
    });
  }
  function renderMulti(container, codes, dict, currentArr, onToggle){
    codes.forEach(function(code){
      var sel = currentArr.indexOf(code) > -1;
      container.appendChild(chip(dict[code], sel, function(){ onToggle(code); }));
    });
  }

  function toggleMulti(arr, val, exclusiveNone){
    var i = arr.indexOf(val);
    if(exclusiveNone && val === 'NONE'){
      arr.length = 0;
      if(i === -1) arr.push('NONE');
      return arr;
    }
    if(exclusiveNone){
      var noneIdx = arr.indexOf('NONE');
      if(noneIdx > -1) arr.splice(noneIdx,1);
    }
    if(i>-1) arr.splice(i,1); else arr.push(val);
    return arr;
  }

  var carouselTimer = null;
  function stopCarousel(){
    if(carouselTimer){ clearInterval(carouselTimer); carouselTimer = null; }
  }
  function startCarousel(container){
    stopCarousel();
    container.innerHTML = '';
    var imgs = SCREENSHOTS.map(function(src, i){
      var img = document.createElement('img');
      img.src = src; img.alt = '';
      if(i===0) img.className = 'active';
      container.appendChild(img);
      return img;
    });
    var idx = 0;
    carouselTimer = setInterval(function(){
      var leaving = imgs[idx];
      idx = (idx + 1) % imgs.length;
      var entering = imgs[idx];
      leaving.classList.remove('active');
      leaving.classList.add('prev');
      entering.classList.add('active');
      setTimeout(function(){
        leaving.style.transition = 'none';
        leaving.classList.remove('prev');
        leaving.offsetWidth; // force reflow so the next transition isn't skipped
        leaving.style.transition = '';
      }, 650);
    }, 2000);
  }

      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(buildPayload())

  function addNav(body, opts){
    var row = document.createElement('div'); row.className='btn-row';

      back.addEventListener('click', function(){ goTo(opts.back); });
      row.appendChild(back);
    }
    var next = document.createElement('button'); next.className='btn primary'; next.textContent=t('next');
    next.disabled = !opts.canNext();
    next.addEventListener('click', function(){ goTo(opts.next); });
    row.appendChild(next);
    body.appendChild(row);
  }

    var card = document.createElement('div'); card.className='card';

    return card;

    var card = ensureCard(i);
    var wasActive = card.classList.contains('active');
    card.className = 'card' + (steps[i].key==='winai' ? ' winai-card' : '') + (wasActive ? ' active' : '');
    card.innerHTML = '';
    steps[i].render(card);
    updateProgress(i);
  }

  function updateProgress(i){
    var step = steps[i];
    var wrap = document.getElementById('progressWrap');
    if(step.progress === false){ wrap.style.display='none'; return; }
    wrap.style.display='block';
    var total = 10;
    var n = i;
    var pct = Math.round((n/total)*100);
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('progressText').textContent = step.title();
    document.getElementById('progressPct').textContent = pct+'%';
  }

  function goTo(i){
    if(cardEls[current]) cardEls[current].classList.remove('active');
    if(steps[current] && steps[current].key === 'winai' && i !== current) stopCarousel();
    current = i;
    render(i);
    var card = cardEls[i];
    void card.offsetWidth; // force reflow so the transition plays instead of snapping
    card.classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  /* ---------------- report builder ---------------- */
  function pct(n, total){ return total ? Math.round(n/total*100) : 0; }

  function countSingle(list, keyFn){
    var m = {};
    list.forEach(function(item){ var k = keyFn(item); if(k) m[k] = (m[k]||0)+1; });
    return m;
  }
  function countMulti(list, arrFn){
    var m = {};
    list.forEach(function(item){ (arrFn(item)||[]).forEach(function(v){ if(v) m[v]=(m[v]||0)+1; }); });
    return m;
  }

  function renderReportBars(container, entries, total, color){
    container.innerHTML = '';
    if(!entries.length){
      container.innerHTML = '<p class="report-empty" style="padding:6px 0;">'+t('reportEmpty')+'</p>';
      return;
    }
    var max = Math.max.apply(null, entries.map(function(e){return e[1];}).concat([1]));
    entries.forEach(function(e){
      var row = document.createElement('div'); row.className='report-bar-row';
      var widthPct = Math.round(e[1]/max*100);
      row.innerHTML =
        '<div class="report-bar-label">'+e[0]+'</div>' +
        '<div class="report-bar-track"><div class="report-bar-fill" style="width:'+widthPct+'%; background:'+color+'"></div></div>' +
        '<div class="report-bar-value mono">'+pct(e[1], total)+'%</div>';
      container.appendChild(row);
    });
  }

  function reportSection(root, titleKey, id){
    var sec = document.createElement('div'); sec.className='report-section';
    sec.innerHTML = '<h3>'+t(titleKey)+'</h3><div id="'+id+'"></div>';
    root.appendChild(sec);
    return sec.querySelector('#'+id);
  }

  function renderReport(records){
    var body = document.getElementById('reportBody');
    body.innerHTML = '';
    var N = records.length;

    if(!N){
      body.innerHTML = '<p class="report-empty">'+t('reportEmpty')+'</p>';
      return;
    }

    var wantLessN = records.filter(function(r){return r.wantLess==='Y';}).length;
    var heavyN = records.filter(function(r){return r.hours==='4-6' || r.hours==='6+';}).length;
    var avgWinai = records.reduce(function(s,r){return s+(r.winai||0);},0)/N;

    var statGrid = document.createElement('div'); statGrid.className='report-stat-grid';
    statGrid.innerHTML =
      '<div class="report-stat"><div class="v">'+N+'</div><div class="k">'+t('reportN')+'</div></div>' +
      '<div class="report-stat"><div class="v">'+pct(wantLessN,N)+'%</div><div class="k">'+t('reportWantLess')+'</div></div>' +
      '<div class="report-stat"><div class="v">'+pct(heavyN,N)+'%</div><div class="k">'+t('reportHeavy')+'</div></div>' +
      '<div class="report-stat"><div class="v human">'+avgWinai.toFixed(1)+'</div><div class="k">'+t('reportWinaiAvg')+'</div></div>';
    body.appendChild(statGrid);

    var clsCount = countSingle(records, function(r){return r.cls;});
    renderReportBars(reportSection(body,'reportSecClass','repClass'),
      CLASSES.filter(function(c){return clsCount[c];}).map(function(c){return [c, clsCount[c]];}), N, 'var(--screen)');

    var hoursCount = countSingle(records, function(r){return r.hours;});
    renderReportBars(reportSection(body,'reportSecHours','repHours'),
      HOURS_CODES.filter(function(h){return hoursCount[h];}).map(function(h){return [t('hours')[h], hoursCount[h]];}), N, 'var(--screen)');

    var platCount = countMulti(records, function(r){return r.platforms;});
    renderReportBars(reportSection(body,'reportSecPlatforms','repPlatforms'),
      PLATFORM_CODES.filter(function(p){return platCount[p];}).map(function(p){return [t('platforms')[p], platCount[p]];}).sort(function(a,b){return b[1]-a[1];}), N, 'var(--screen)');

    var devCount = countSingle(records, function(r){return r.device;});
    renderReportBars(reportSection(body,'reportSecDevice','repDevice'),
      DEVICE_CODES.filter(function(d){return devCount[d];}).map(function(d){return [t('device')[d], devCount[d]];}), N, 'var(--screen)');

    var osCount = countSingle(records, function(r){return r.os;});
    renderReportBars(reportSection(body,'reportSecOS','repOS'),
      ['AND','IOS'].filter(function(o){return osCount[o];}).map(function(o){return [t('os')[o], osCount[o]];}), N, 'var(--screen)');

    var wantCount = countSingle(records, function(r){return r.wantLess;});
    renderReportBars(reportSection(body,'reportSecWantLess','repWant'),
      WANT_CODES.filter(function(w){return wantCount[w];}).map(function(w){return [t('wantLess')[w], wantCount[w]];}), N, 'var(--screen)');

    var actCount = countMulti(records, function(r){return r.actions;});
    renderReportBars(reportSection(body,'reportSecActions','repActions'),
      ACTION_CODES.filter(function(a){return actCount[a];}).map(function(a){return [t('actions')[a], actCount[a]];}).sort(function(a,b){return b[1]-a[1];}), N, 'var(--human)');

    var impCount = countMulti(records, function(r){return r.impacts;});
    renderReportBars(reportSection(body,'reportSecImpacts','repImpacts'),
      IMPACT_CODES.filter(function(i){return impCount[i];}).map(function(i){return [t('impacts')[i], impCount[i]];}).sort(function(a,b){return b[1]-a[1];}), N, 'var(--human)');

    var actyCount = countSingle(records, function(r){return r.activity;});
    renderReportBars(reportSection(body,'reportSecActivity','repActivity'),
      ACTIVITY_CODES.filter(function(a){return actyCount[a];}).map(function(a){return [t('activity')[a], actyCount[a]];}), N, 'var(--human)');

    var winaiCount = countSingle(records, function(r){return r.winai;});
    renderReportBars(reportSection(body,'reportSecWinai','repWinai'),
      [1,2,3,4,5].filter(function(w){return winaiCount[w];}).map(function(w){return [w+' / 5', winaiCount[w]];}), N, 'var(--human)');

    // conclusions (English-language summary, independent of UI language)
    var concSec = document.createElement('div'); concSec.className='report-section';
    concSec.innerHTML = '<h3>'+t('reportSecConclusions')+'</h3>';
    var box = document.createElement('div'); box.className='report-conclusions';
    var platEntries = Object.keys(platCount).map(function(k){return [t('platforms')[k], platCount[k]];}).sort(function(a,b){return b[1]-a[1];});
    var devEntries = Object.keys(devCount).map(function(k){return [t('device')[k], devCount[k]];}).sort(function(a,b){return b[1]-a[1];});
    var lines = [];
    lines.push(N + ' student' + (N===1?'':'s') + ' responded' + (devEntries.length ? (', mostly on ' + devEntries[0][0] + ' (' + pct(devEntries[0][1],N) + '%).') : '.'));
    if(platEntries.length) lines.push(platEntries[0][0] + ' is the most-used platform (' + pct(platEntries[0][1],N) + '%).');
    lines.push(pct(heavyN,N) + '% spend 4+ hours a day on social media.');
    lines.push(pct(wantLessN,N) + '% say they want to use it less.');
    lines.push('Average interest in Winai is ' + avgWinai.toFixed(1) + ' / 5.');
    lines.forEach(function(l){
      var d = document.createElement('div'); d.className='report-conclusion'; d.textContent = l;
      box.appendChild(d);
    });
    concSec.appendChild(box);
    body.appendChild(concSec);
  }

  var reportOverlay = document.getElementById('reportOverlay');
  document.getElementById('reportClose').addEventListener('click', function(){
    reportOverlay.classList.remove('show');
  });
  document.getElementById('reportToggle').addEventListener('click', function(){
    var pw = window.prompt(t('reportPwPrompt'));
    if(pw === null) return;
    if(pw !== CONFIG.REPORT_PASSWORD){ window.alert(t('reportPwWrong')); return; }
    document.getElementById('reportTitle').textContent = t('reportTitle');
    var body = document.getElementById('reportBody');
    body.innerHTML = '<p class="report-empty">'+t('reportLoading')+'</p>';
    reportOverlay.classList.add('show');

    if(!CONFIG.SHEETS_WEBAPP_URL || CONFIG.SHEETS_WEBAPP_URL.indexOf('PASTE_') === 0){
      body.innerHTML = '<p class="report-empty">'+t('reportError')+'</p>';
      return;
    }
    fetch(CONFIG.SHEETS_WEBAPP_URL + '?pw=' + encodeURIComponent(pw))
      .then(function(res){ return res.json(); })
      .then(function(data){
        if(!Array.isArray(data)) throw new Error('bad response');
        renderReport(data);
      })
      .catch(function(){
        body.innerHTML = '<p class="report-empty">'+t('reportError')+'</p>';
      });
  });

  updateLangUI();
  goTo(0);
})();
</script>
